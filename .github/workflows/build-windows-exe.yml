name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install UPX
        run: choco install upx -y

      - name: Build executable
        run: pyinstaller --onefile --name MyAgrarScraper scraper.py

      # Published as a GitHub Release asset instead of an Actions artifact -
      # Actions artifact storage has a tight 500MB free-tier quota shared
      # across all runs (easy to exhaust during active iteration, and takes
      # 6-12 hours to recalculate after deleting old ones); Releases don't
      # share that quota and don't expire.
      - name: Publish as a release
        shell: bash
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          git tag -f latest-build
          git push -f origin latest-build
          gh release create latest-build dist/MyAgrarScraper.exe \
            --title "Latest build" \
            --notes "Automatically built from commit ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
